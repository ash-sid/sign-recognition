<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Extractor seam capture</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin: 0.6rem 0; }
      pre { background: #f2f2f2; padding: 0.8rem; overflow-x: auto; }
    </style>
  </head>
  <body>
    <h1>Extractor seam capture</h1>
    <p>
      Runs the page's own landmarkers over a folder of PNG frames and downloads what they
      produced, for comparison with <code>src/extract_landmarks.py</code> over the same files.
      Served by the development server only; the production build does not include it.
    </p>
    <label>Frames <input id="files" type="file" accept="image/png" multiple /></label>
    <label>Clip name <input id="clip" type="text" value="clip1" /></label>
    <label>Frame rate <input id="fps" type="number" value="30" min="1" step="any" /></label>
    <label>
      Delegate
      <select id="delegate">
        <option value="GPU">GPU (what the live page uses)</option>
        <option value="CPU">CPU</option>
      </select>
    </label>
    <button id="run" type="button">Run and download</button>
    <pre id="log"></pre>
    <script type="module" src="/src/seam.ts"></script>
  </body>
</html>
